name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Reflekt.slnx

      - name: Build
        run: dotnet build Reflekt.slnx -c Release --no-restore

      - name: Test
        # Tests inject placeholder Google credentials and an in-memory SQLite
        # connection themselves (see ReflektApiFactory), so no secrets are needed.
        run: dotnet test Reflekt.slnx -c Release --no-build --verbosity normal

  frontend:
    name: Frontend — type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/reflekt-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/reflekt-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check & build
        # `npm run build` runs vue-tsc (type-check) then vite build
        run: npm run build
